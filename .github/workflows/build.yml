name: Build & Package Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS Application with PyInstaller
        run: |
          pyinstaller "CircuitRunners Outreach.spec" --noconfirm

      - name: Package into DMG
        run: |
          mkdir -p dmg_stage
          cp -R "dist/CircuitRunners Outreach.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "CircuitRunners Outreach" -srcfolder dmg_stage -ov -format UDZO "dist/CircuitRunners-Outreach-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircuitRunners-Outreach-macOS-dmg
          path: dist/CircuitRunners-Outreach-macOS.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows .msi
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cx_Freeze

      - name: Build MSI Installer with cx_Freeze
        run: |
          python setup.py bdist_msi

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircuitRunners-Outreach-Windows-msi
          path: dist/*.msi
          if-no-files-found: error
